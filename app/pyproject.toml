[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "neo4j-agent-memory[sentence-transformers]>=0.7.0",
    "numpy>=2.5.4",
    "openai>=3.33.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart==0.0.20",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "torch>=2.14.1",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

# CPU-only torch on Linux (the Docker image): the default wheel pulls ~3 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
