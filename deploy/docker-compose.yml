# Production stack for Dokploy (Compose service, compose path: deploy/docker-compose.yml).
# Set in Dokploy → Environment: TYPESAFE_API_KEY, AIAND_API_KEY, MAP_KEYS, NEO4J_PASSWORD, optional ESRI_API_KEY.
# Route the domain to service "app", port 8000.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      AIAND_API_KEY: ${AIAND_API_KEY}
      MAP_KEYS: ${MAP_KEYS}
      ESRI_API_KEY: ${ESRI_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - sentinel-cache:/app/app/.cache  # API responses, terrain, land cover, photos
    depends_on:
      neo4j:
        condition: service_healthy
    expose:
      - "8000"

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  sentinel-cache:
  neo4j-data:
