# Local Neo4j for offline development and as a demo fallback if venue Wi-Fi fails.
# Browser: http://localhost:7474 · Bolt: neo4j://localhost:7687 · user neo4j / local dev password below.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: wildfire-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/wildfire-local-dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
